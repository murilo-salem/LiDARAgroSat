paths:
  output_dir: outputs_ablation_basic

data:
  split_mode: basic
  basic_train_fraction: 0.8
  basic_val_fraction: 0.1
  basic_split_seed: 13
  adaptive_target_sigma: true
  adaptive_sigma_a: 0.25
  adaptive_sigma_b: 0.03
  adaptive_sigma_min_m: 0.45
  adaptive_sigma_max_m: 1.20

training:
  epochs: 120
  validation_interval_epochs: 1
  min_epochs_before_stop: 25
  accumulation_steps: 4
  batch_size: 2
  patience: 15
  num_workers: 4

evaluation:
  tune_postprocess: true
  use_tta: true
  confidence_threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
  nms_radius_grid_m: [0.8, 1.0, 1.2, 1.5, 1.8]
  min_pred_height_grid_m: [null, 1.5, 2.0, 2.5]
  min_chm_at_center_grid_m: [null, 2.0, 2.5, 3.0]
  border_margin_grid_px: [0, 8, 16]
