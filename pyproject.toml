[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidaragrosat"
version = "0.1.0"
description = "Multimodal UAV LiDAR + RGB individual tree detection for dense mixed forests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Murilo" }
]
dependencies = [
  "affine>=2.4",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "laspy[lazrs]>=2.5",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "torch>=2.3",
  "torchvision>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
tracking = [
  "mlflow>=2.12",
  "wandb>=0.17",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
